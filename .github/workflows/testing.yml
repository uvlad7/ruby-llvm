name: Matrix Testing

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel, windows-2022, windows-2025]
        ruby: ['3.1', '3.2', '3.3', '3.4']
        include:
          - os: windows-11-arm
            ruby: '3.4'
    continue-on-error: true
    steps:
      - name: Install LLVM on macos
        if: startsWith(matrix.os, 'macos')
        id: macos_setup
        run: |
          echo "setup=false" >> "$GITHUB_OUTPUT"
          brew update
          # brew update --auto-update
          # "llvm@22" is a homebrew-core forward-alias (Aliases/llvm@22) onto
          # the plain "llvm" formula, kept in sync with whichever major is
          # currently rolling (22.x); once "llvm" itself bumps to 23, a real
          # frozen llvm@22.rb formula takes over so this keeps meaning 22.x.
          brew install llvm@22
          # On Intel, llvm is keg-only for :provided_by_macos, a reason Homebrew
          # now hard-refuses to `brew link --force` (ARM links fine) — so link
          # it ourselves instead, the same way on both architectures.
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          # ffi's dlopen checks DYLD_LIBRARY_PATH before its hardcoded dirs:
          # https://github.com/ffi/ffi/blob/master/lib/ffi/dynamic_library.rb#L33
          echo "DYLD_LIBRARY_PATH=$(brew --prefix llvm@22)/lib" >> "$GITHUB_ENV"
          echo "setup=true" >> "$GITHUB_OUTPUT"
      - name: 'MacOS debug'
        if: steps.macos_setup.outputs.setup == 'false'
        run: |
          echo $(brew --repository)
          echo $(brew --prefix llvm@22)
          echo $(brew info llvm@22)
          echo "$PATH"
          echo $(llvm-config --ldflags)
          ls -l $(brew --prefix llvm@22)/lib/libLLVM.dylib
          ls -l $(brew --prefix)/lib/libLLVM.dylib
      - name: Install LLVM on ubuntu
        id: ubuntu_setup
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo "setup=false" >> "$GITHUB_OUTPUT"
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # sudo apt-get install -y libpolly-22-dev
          echo "setup=true" >> "$GITHUB_OUTPUT"
      - name: Configure windows build env
        id: windows_setup
        if: startsWith(matrix.os, 'windows')
        run: |
          # ruby/setup-ruby reads msys2_mingw_dependencies from the gemspec and
          # installs LLVM into its own managed MSYS2 toolchain tree before running
          # bundle install, so no separate MSYS2/pacman setup is needed here.
          echo "setup=false" >> $env:GITHUB_OUTPUT
          # On x86-64 the runner ships an MSVC clang++.exe that find_cxx would
          # pick over MinGW g++ (passes --version but rejects -fPIC). Force g++
          # since no MSVC g++ exists to shadow it. On ARM64 leave CXX unset and
          # let find_cxx resolve the CLANGARM64 toolchain naturally.
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            Add-Content -Path $env:GITHUB_ENV -Value "CXX=g++"
          }
          # MSYS2 installs the rolling 'opt.exe', not the versioned 'opt-22.exe'
          Add-Content -Path $env:GITHUB_ENV -Value "OPT=opt"
          echo "setup=true" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - uses: ruby/setup-ruby@v1
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          bundler: latest
          rubygems: latest

      - name: Diagnose windows LLVM toolchain
        if: startsWith(matrix.os, 'windows')
        run: |
          $ruby_topdir = ruby -e "print RbConfig::TOPDIR"
          $bin = Join-Path $ruby_topdir "msys64\$($env:MSYSTEM.ToLower())\bin"
          Write-Host "MSYSTEM=$env:MSYSTEM"
          Write-Host "PATH=$env:PATH"
          Write-Host "Looking in $bin"
          Get-ChildItem $bin -Filter 'llvm-config*' -ErrorAction SilentlyContinue
          Get-Command llvm-config -ErrorAction SilentlyContinue
      - name: Debug session
        if: contains(matrix.os, 'intel')
        uses: mxschmitt/action-tmate@v3
      - run: cd ext/ruby-llvm-support && bundle exec rake
        name: "Build support library"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - run: bundle exec rake
        name: "Run tests"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - run: bundle exec rake test:samples
        name: "Run samples"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - name: "Typecheck"
        run: bundle exec srb tc
        # sorbet-static has no Windows build (see Gemfile), so windows_setup is
        # deliberately omitted here, unlike the steps above
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'
