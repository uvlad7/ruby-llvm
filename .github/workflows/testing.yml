name: Matrix Testing

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, macos-14, macos-15, macos-15-intel, macos-26, macos-26-intel, windows-2022, windows-2025]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        include:
          - os: windows-11-arm
            ruby: '3.4'
          - os: windows-11-arm
            ruby: '4.0'
          - os: windows-2025
            ruby: ruby-mswin
          # jruby and truffleruby differ from CRuby in how they back FFI, not per-OS, so one
          # linux and one macos each is the signal; the full cross-product is not worth 18 jobs.
          - os: ubuntu-24.04
            ruby: jruby
          - os: ubuntu-24.04
            ruby: truffleruby
          - os: macos-15
            ruby: jruby
          - os: macos-15
            ruby: truffleruby
        exclude:
          - os: ubuntu-26.04
            ruby: '3.1'
          # Ruby 3.1's MSYS2 archive comes with gcc already installed, pinned to gcc-libs=14.2.0-3:
          #   error: failed to prepare transaction (could not satisfy dependencies)
          # :: installing mingw-w64-ucrt-x86_64-gcc-libs (16.1.0-5) breaks
          #     dependency 'mingw-w64-ucrt-x86_64-gcc-libs=14.2.0-3' required by mingw-w64-ucrt-x86_64-gcc
          - os: windows-2022
            ruby: '3.1'
          - os: windows-2025
            ruby: '3.1'
    continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
    steps:
      # checkout/setup-ruby run before the LLVM installs, not after as on master:
      # the windows path calls `ridk exec` to install LLVM into the MSYS2 tree of
      # whichever Ruby setup-ruby just installed, so Ruby has to exist first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          bundler: latest
          rubygems: latest
      - name: Install LLVM on macos
        if: startsWith(matrix.os, 'macos')
        id: macos_setup
        run: |
          echo "setup=false" >> "$GITHUB_OUTPUT"
          brew update
          # brew update --auto-update
          # "llvm@22" is a homebrew-core forward-alias (Aliases/llvm@22) onto
          # the plain "llvm" formula, kept in sync with whichever major is
          # currently rolling (22.x); once "llvm" itself bumps to 23, a real
          # frozen llvm@22.rb formula takes over so this keeps meaning 22.x.
          brew install llvm@22
          # On Intel, llvm is keg-only for :provided_by_macos, a reason Homebrew
          # now hard-refuses to `brew link --force` (ARM links fine) — so link
          # it ourselves instead, the same way on both architectures.
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          # ffi's dlopen checks DYLD_LIBRARY_PATH before its hardcoded dirs:
          # https://github.com/ffi/ffi/blob/master/lib/ffi/dynamic_library.rb#L33
          echo "DYLD_LIBRARY_PATH=$(brew --prefix llvm@22)/lib" >> "$GITHUB_ENV"
          echo "setup=true" >> "$GITHUB_OUTPUT"
      - name: 'MacOS debug'
        if: startsWith(matrix.os, 'macos') && (steps.macos_setup.outputs.setup == 'false' || runner.debug == '1')
        run: |
          echo $(brew --repository)
          echo $(brew --prefix llvm@22)
          echo $(brew info llvm@22)
          echo "$PATH"
          echo $(llvm-config --ldflags)
          ls -l $(brew --prefix llvm@22)/lib/libLLVM*.dylib || echo "Not found"
          ls -l $(brew --prefix)/lib/libLLVM*.dylib || echo "Not found"
      - name: Install LLVM on ubuntu
        id: ubuntu_setup
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo "setup=false" >> "$GITHUB_OUTPUT"
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # sudo apt-get install -y libpolly-22-dev
          echo "setup=true" >> "$GITHUB_OUTPUT"
      - name: Install LLVM on windows
        id: windows_setup
        if: startsWith(matrix.os, 'windows')
        run: |
          # pwsh only aborts on a failing cmdlet by default, and only checks the
          # exit code of the last command in the script, so make native command
          # failures terminating and check them explicitly as well.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          echo "setup=false" >> $env:GITHUB_OUTPUT
          if ('${{ matrix.ruby }}' -eq 'ruby-mswin') {
            # MSVC LLVM from the official llvm.org release (same build as local debug-win setup).
            # Use the clang+llvm-* archive (not LLVM-*.exe): the installer is toolchain-only;
            # the archive adds LLVM headers and libs needed to build software that uses LLVM.
            $archive = "$env:TEMP\llvm-22.1.8-msvc.tar.xz"
            Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz" -OutFile $archive -UseBasicParsing
            New-Item -ItemType Directory -Force -Path C:\llvm-msvc | Out-Null
            # Git's MSYS2 /usr/bin/tar shadows Windows' bsdtar and treats "C:" as a hostname;
            # call System32\tar.exe directly to get Windows-path-aware bsdtar.
            & "$env:SystemRoot\System32\tar.exe" -xf $archive -C C:\llvm-msvc --strip-components=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            echo "C:\llvm-msvc\bin" >> $env:GITHUB_PATH
          } else {
            # ridk exec resolves the correct MSYS2 root + MSYSTEM (UCRT64 on
            # x86-64, CLANGARM64 on windows-11-arm) for whichever Ruby
            # ruby/setup-ruby just installed, and runs pacman against that SAME
            # tree — no separate MSYS2 install, so no second tree to get out of
            # sync with the one the build actually links against.
            # Use a PS double-quoted string so PowerShell wraps the -c argument in
            # cmd.exe double quotes (no embedded " → no \"-escaping), which protects
            # > and < from cmd.exe redirect interpretation. Backtick-escape $ so
            # PowerShell doesn't expand the bash variable. Use sh single-quote
            # concatenation (e.g. llvm'>=22.1.0') to protect > and < from bash.
            ridk exec sh -c "pacman -Sy --noconfirm --noprogressbar --needed --disable-download-timeout `$MINGW_PACKAGE_PREFIX-llvm'>=22.1.0' `$MINGW_PACKAGE_PREFIX-llvm'<22.2'"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # On x86-64 the runner ships an MSVC clang++.exe that find_cxx would
            # pick over MinGW g++ (passes --version but rejects -fPIC). Force g++
            # since no MSVC g++ exists to shadow it. On ARM64 leave CXX unset and
            # let find_cxx resolve the CLANGARM64 toolchain naturally.
            if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
              Add-Content -Path $env:GITHUB_ENV -Value "CXX=g++"
            }
          }
          # MSYS2/llvm-project release both install the rolling 'opt.exe', not the versioned 'opt-22.exe'
          Add-Content -Path $env:GITHUB_ENV -Value "OPT=opt"
          echo "setup=true" >> $env:GITHUB_OUTPUT
      - name: 'Windows debug'
        if: startsWith(matrix.os, 'windows') && matrix.ruby != 'ruby-mswin' && (steps.windows_setup.outputs.setup == 'false' || runner.debug == '1')
        run: |
          ridk exec sh -c 'echo MSYSTEM=$MSYSTEM; pacman -Q $MINGW_PACKAGE_PREFIX-llvm; llvm-config --bindir --libdir --ldflags; ls -l $(llvm-config --bindir)/libLLVM*; ls -l $(llvm-config --libdir)/libLLVM-22.*'
          echo "$env:PATH"
          Get-Command llvm-config -ErrorAction SilentlyContinue
      # - name: Debug session
      #   if: contains(matrix.os, 'intel')
      #   uses: mxschmitt/action-tmate@v3
      - run: cd ext/ruby-llvm-support && bundle exec rake
        name: "Build support library"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - run: bundle exec rake
        name: "Run tests"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - run: bundle exec rake test:samples
        name: "Run samples"
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true' || steps.windows_setup.outputs.setup == 'true'
      - name: "Typecheck"
        run: bundle exec srb tc
        # sorbet-static has no Windows build (see Gemfile), so windows_setup is
        # deliberately omitted here, unlike the steps above
        if: steps.macos_setup.outputs.setup == 'true' || steps.ubuntu_setup.outputs.setup == 'true'

  # Cygwin is its own platform, not a Windows one: POSIX paths, its own libc (cygwin1.dll), and
  # its own ruby. Not reachable from the matrix above, which drives ruby/setup-ruby.
  test-cygwin:
    runs-on: windows-2025
    # Cygwin's slow fork/exec makes gem installs crawl; cap it so a stall can't run for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cygwin/cygwin-install-action@v6
        with:
          # llvm/clang 22.x are only in Cygwin's test channel (stable tops out at 20.x). Cygwin
          # setup matches the exact version-release (no major.minor pinning), so pin each:
          # LLVM 22.1.8 (clang's Cygwin revision is -2, the rest -1) and Ruby 4.0.6-1.
          # pkg-config lets ffi find the system libffi instead of doing a slow bundled build.
          allow-test-packages: true
          packages: >-
            ruby=4.0.6-1, ruby-devel=4.0.6-1, rubygems, llvm=22.1.8-1, libllvm-devel=22.1.8-1,
            clang=22.1.8-2, gcc-core, gcc-g++, make, libffi-devel, pkg-config, git
      - name: "Build + test"
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
        run: |
          # The runner's preinstalled Windows Ruby (hostedtoolcache) leaks into the Cygwin shell and
          # shadows Cygwin's ruby/bundle (bundle exec then re-execs the wrong ruby → LoadError).
          # Strip any ruby-named PATH entry, the same way ruby/setup-ruby does.
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -viE '\bruby\b' | paste -sd:)"
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          export OPT=opt
          bundle config set --local build.ffi --enable-system-libffi
          bundle install --jobs 4
          (cd ext/ruby-llvm-support && bundle exec rake)
          bundle exec rake
          bundle exec rake test:samples

  # Distro containers cover the libc/word-size axes the hosted runners cannot: musl, and 32-bit
  # x86. Each installs the distro's own llvm-22 rather than apt.llvm.org, so the bindings are
  # exercised against however that distro packaged it.
  test-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: a different libc, and the one most likely to expose assumptions about glibc.
          - {label: 'Alpine musl x86_64', image: 'alpine:edge', platform: 'linux/amd64'}
          # 32-bit x86: half-width pointers, and the i386 ABI the JIT stack-realign work targets.
          - {label: 'Debian glibc i386', image: 'i386/debian:testing', platform: 'linux/386'}
          # 32-bit arm, via qemu; slowest of the three, so it runs last.
          - {label: 'Debian glibc armv7', image: 'arm32v7/debian:testing', platform: 'linux/arm/v7'}
    name: ${{ matrix.label }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable qemu for non-native platforms
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
      - name: Build + test
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$GITHUB_WORKSPACE":/w -w /w \
            ${{ matrix.image }} sh -euxc '
              if command -v apk >/dev/null; then
                apk add --no-cache ruby ruby-dev build-base llvm22 llvm22-dev libffi-dev
                # Alpine names opt "opt22" (no dash), so the default OPT (opt-22) misses.
                export OPT=opt22
              else
                apt-get update
                apt-get install -y --no-install-recommends ruby ruby-dev build-essential \
                  llvm-22 llvm-22-dev libclang-common-22-dev libffi-dev git ca-certificates
                export OPT=opt-22
              fi
              gem install bundler --no-document
              # Debian ships a rubygems too old for the precompiled ffi gem; build it from source.
              bundle config set --local force_ruby_platform true
              bundle install
              (cd ext/ruby-llvm-support && bundle exec rake)
              bundle exec rake
              bundle exec rake test:samples
            '

  # FreeBSD is not a hosted runner; cross-platform-actions boots a VM image.
  test-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build + test on FreeBSD
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: '14.2'
          run: |
            sudo pkg install -y ruby devel/ruby-gems llvm22 libffi gmake pkgconf git
            # FreeBSD installs LLVM under /usr/local/llvm22, off PATH.
            export PATH="/usr/local/llvm22/bin:$PATH"
            export OPT=opt
            sudo gem install bundler --no-document
            bundle install
            (cd ext/ruby-llvm-support && bundle exec rake)
            bundle exec rake
            bundle exec rake test:samples

# Still uncovered: mingw32 and cygwin-32 (no 32-bit ruby in setup-ruby / cygwin-install-action;
# both also top out at LLVM 21, so they belong on the llvm-21 branch), msys proper (as opposed to
# the mingw64 toolchain the matrix already uses), ppc64le and sparc64 (qemu-only, and sparc64 is
# the only big-endian target worth adding if byte-order coverage is wanted).
